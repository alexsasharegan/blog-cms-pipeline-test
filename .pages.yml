# Pages CMS config for the blog. Pages CMS reads this file from the branch being edited.
media:
  input: static/images/blog
  output: /images/blog

content:
  - name: blog
    label: Blog
    type: collection
    path: content/blog
    format: yaml-frontmatter
    subfolders: false
    exclude:
      - _index.md
    filename: "{title}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: summary
        label: Summary
        type: text
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: body
        label: Body
        type: rich-text
