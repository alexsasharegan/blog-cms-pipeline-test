name: Preview Branch

# A preview for every pull request: built from the pull request's branch, served at a workers.dev address
# (public by link, noindex), and the address is posted on the pull request. It never deploys to production.
# Same-repository branches only: a fork's pull request has no secrets.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: scripts/build.sh preview
      - name: Deploy the Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          name="$(scripts/preview-name.sh "$PR")"
          echo "Preview name: $name"
          # pipefail and a check on the JSON: a failed preview once printed an error and still passed.
          set -o pipefail
          npx --no-install wrangler preview -c wrangler.preview.jsonc --name "$name" --message "$GITHUB_SHA" --json | tee preview.json
          if grep -q '"error"' preview.json; then echo "wrangler preview reported an error (see above)" >&2; exit 1; fi
      - name: Report the Preview
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- preview-comment -->"
          url=""
          [ -s preview.json ] && url="$(jq -r '.preview.urls[0] // empty' preview.json 2>/dev/null || true)"
          if [ -n "$url" ]; then
            body="$marker"$'\n'"**Preview:** $url"$'\n\n'"Commit \`${GITHUB_SHA:0:7}\`. Anyone with the link can read it; it carries noindex."
          else
            body="$marker"$'\n'"**No preview address was returned.** See the run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          { echo "### Preview Branch"; echo "$body"; } >> "$GITHUB_STEP_SUMMARY"
          # One comment, updated on every push.
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq "[.[] | select(.body | startswith(\"$marker\"))] | first | .id // empty")"
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null; fi
